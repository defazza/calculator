<!doctype html>
<html lang="ru">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Калькулятор</title>
        <link rel="stylesheet" href="calc.css" />
    </head>
    <body>
        <section>
            <h1>Приложение калькулятор</h1>
            <h2>Создатель - Кирилл Скидин</h2>
        </section>
        <div class="calculator">
            <input type="text" id="display" readonly />

            <div class="buttons">
                <button class="digit-btn" id="btn-7">7</button>
                <button class="digit-btn" id="btn-8">8</button>
                <button class="digit-btn" id="btn-9">9</button>
                <button class="btn-oper" id="btn-division">÷</button>

                <button class="digit-btn" id="btn-4">4</button>
                <button class="digit-btn" id="btn-5">5</button>
                <button class="digit-btn" id="btn-6">6</button>
                <button class="btn-oper" id="btn-multiply">×</button>

                <button class="digit-btn" id="btn-1">1</button>
                <button class="digit-btn" id="btn-2">2</button>
                <button class="digit-btn" id="btn-3">3</button>
                <button class="btn-oper" id="btn-minus">-</button>

                <button id="btn-clear">C</button>
                <button class="digit-btn" id="btn-0">0</button>
                <button class="btn-oper" id="btn-equals">=</button>
                <button class="btn-oper" id="btn-plus">+</button>
            </div>
        </div>
        <script src="calcl.js"></script>
    </body>
</html>
